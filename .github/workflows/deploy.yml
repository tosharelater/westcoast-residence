name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t westcoast-site:latest .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship image and restart container
        run: |
          docker save westcoast-site:latest | gzip | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "gunzip | docker load"
          scp docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/westcoast/docker-compose.yml || {
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ~/westcoast"
            scp docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/westcoast/docker-compose.yml
          }
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd ~/westcoast && docker compose up -d --force-recreate && docker image prune -f"
