server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Security headers (TLS/HSTS should also be set on the reverse proxy terminating HTTPS)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; frame-src 'self' https://www.google.com https://maps.google.com https://www.google.com/maps/; connect-src 'self'; upgrade-insecure-requests" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

  location = /robots.txt {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location ^~ /.well-known/ {
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  location ~* \.(?:css|js|webp|png|jpg|jpeg|svg|woff2?|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  error_page 404 /404.html;
}
